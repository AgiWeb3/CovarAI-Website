<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" width="240" height="64">
  <defs>
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <linearGradient id="logoBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <linearGradient id="logoCoreGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="40%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>

    <linearGradient id="logoTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
  </defs>

  <!-- Emblem Icon -->
  <g transform="translate(6, 6)">
    <rect x="0" y="0" width="52" height="52" rx="14" fill="url(#logoBgGrad)"/>
    <rect x="0" y="0" width="52" height="52" rx="14" fill="none" stroke="url(#logoBorderGrad)" stroke-width="2"/>

    <g transform="translate(26 26) rotate(45)">
      <rect x="-12" y="-12" width="24" height="24" rx="3.5" fill="url(#logoCoreGrad)"/>
      <rect x="-9" y="-9" width="18" height="18" rx="2" fill="#09090b" opacity="0.92"/>
      <rect x="-5" y="-5" width="10" height="10" rx="1.2" fill="url(#logoCoreGrad)"/>
      <rect x="-1.5" y="-1.5" width="3" height="3" fill="#ffffff" opacity="0.9"/>
    </g>
  </g>

  <!-- Brand Typography -->
  <text x="70" y="38" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="26" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
    Covar<tspan fill="url(#logoTextGrad)">AI</tspan>
  </text>
  <text x="71" y="50" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="600" fill="#94a3b8" letter-spacing="1.5">
    CONFIDENTIAL AGENT INFRA
  </text>
</svg>
