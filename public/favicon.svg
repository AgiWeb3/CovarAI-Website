<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Border Glowing Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Core Diamond Gradient -->
    <linearGradient id="coreGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="40%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>

    <!-- Accent Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Rounded Shield Card -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="none" stroke="url(#borderGrad)" stroke-width="2.5"/>

  <!-- Subtle Cyan Ambient Light -->
  <circle cx="32" cy="32" r="18" fill="#06b6d4" opacity="0.15" filter="url(#glow)"/>

  <!-- Geometric 45-degree Rotating Diamond Tensor Core -->
  <g transform="translate(32 32) rotate(45)">
    <!-- Outer Diamond Layer -->
    <rect x="-14" y="-14" width="28" height="28" rx="4" fill="url(#coreGrad)" filter="url(#glow)"/>
    
    <!-- Geometric Shield Grid Lines -->
    <rect x="-11" y="-11" width="22" height="22" rx="2.5" fill="#09090b" opacity="0.92"/>
    
    <!-- Central Covariance Crystal / Core Tensor -->
    <rect x="-6" y="-6" width="12" height="12" rx="1.5" fill="url(#coreGrad)"/>
    <rect x="-2" y="-2" width="4" height="4" rx="0.5" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Cybernetic Corner Precision Accents -->
  <circle cx="12" cy="12" r="1.5" fill="#a855f7" opacity="0.8"/>
  <circle cx="52" cy="12" r="1.5" fill="#6366f1" opacity="0.8"/>
  <circle cx="52" cy="52" r="1.5" fill="#22d3ee" opacity="0.8"/>
  <circle cx="12" cy="52" r="1.5" fill="#3b82f6" opacity="0.8"/>
</svg>
